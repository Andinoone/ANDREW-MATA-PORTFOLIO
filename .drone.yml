
kind: pipeline
type: docker
name: default

steps:
  - name: deploy
    image: docker:cli
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker build -t myapp:latest .
      - docker rm -f myapp || true
      - docker run -d --name myapp -p 3001:3000 myapp:latest

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
